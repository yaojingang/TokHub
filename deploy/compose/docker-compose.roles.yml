      TOKHUB_AI_GEMINI_OAUTH_ENABLED: ${TOKHUB_AI_GEMINI_OAUTH_ENABLED:-false}
      TOKHUB_AI_DEEPSEEK_GUIDED_ENABLED: ${TOKHUB_AI_DEEPSEEK_GUIDED_ENABLED:-true}
      TOKHUB_AI_DEEPSEEK_WEB_EXPERIMENTAL: ${TOKHUB_AI_DEEPSEEK_WEB_EXPERIMENTAL:-false}
      TOKHUB_AI_DEEPSEEK_WEB_BRIDGE_URL: ${TOKHUB_AI_DEEPSEEK_WEB_BRIDGE_URL:-http://deepseek-web-bridge:5001}
      TOKHUB_AI_DEEPSEEK_WEB_ACK: ${TOKHUB_AI_DEEPSEEK_WEB_ACK:-}
      TOKHUB_AI_OPENCLI_BROWSER_EXPERIMENTAL: ${TOKHUB_AI_OPENCLI_BROWSER_EXPERIMENTAL:-false}
      TOKHUB_AI_OPENCLI_BROWSER_ACK: ${TOKHUB_AI_OPENCLI_BROWSER_ACK:-}
      TOKHUB_AI_OPENCLI_BROWSER_TASK_TIMEOUT: ${TOKHUB_AI_OPENCLI_BROWSER_TASK_TIMEOUT:-2m}
      TOKHUB_AI_OPENCLI_CHATGPT_ENABLED: ${TOKHUB_AI_OPENCLI_CHATGPT_ENABLED:-true}
      TOKHUB_AI_OPENCLI_GEMINI_ENABLED: ${TOKHUB_AI_OPENCLI_GEMINI_ENABLED:-true}
      TOKHUB_AI_OPENCLI_DEEPSEEK_ENABLED: ${TOKHUB_AI_OPENCLI_DEEPSEEK_ENABLED:-true}
      TOKHUB_AI_OPENCLI_CHATGPT_MIN_INTERVAL: ${TOKHUB_AI_OPENCLI_CHATGPT_MIN_INTERVAL:-10s}
      TOKHUB_AI_OPENCLI_GEMINI_MIN_INTERVAL: ${TOKHUB_AI_OPENCLI_GEMINI_MIN_INTERVAL:-10s}
      TOKHUB_AI_OPENCLI_DEEPSEEK_MIN_INTERVAL: ${TOKHUB_AI_OPENCLI_DEEPSEEK_MIN_INTERVAL:-15s}
      TOKHUB_AI_OPENCLI_CHATGPT_HOURLY_LIMIT: ${TOKHUB_AI_OPENCLI_CHATGPT_HOURLY_LIMIT:-30}
      TOKHUB_AI_OPENCLI_GEMINI_HOURLY_LIMIT: ${TOKHUB_AI_OPENCLI_GEMINI_HOURLY_LIMIT:-30}
      TOKHUB_AI_OPENCLI_DEEPSEEK_HOURLY_LIMIT: ${TOKHUB_AI_OPENCLI_DEEPSEEK_HOURLY_LIMIT:-20}
      TOKHUB_AI_OPENCLI_CHATGPT_DAILY_LIMIT: ${TOKHUB_AI_OPENCLI_CHATGPT_DAILY_LIMIT:-120}
      TOKHUB_AI_OPENCLI_GEMINI_DAILY_LIMIT: ${TOKHUB_AI_OPENCLI_GEMINI_DAILY_LIMIT:-120}
      TOKHUB_AI_OPENCLI_DEEPSEEK_DAILY_LIMIT: ${TOKHUB_AI_OPENCLI_DEEPSEEK_DAILY_LIMIT:-80}
      TOKHUB_AI_CHATGPT_CODEX_EXPERIMENTAL: ${TOKHUB_AI_CHATGPT_CODEX_EXPERIMENTAL:-false}
      TOKHUB_AI_OAUTH_REFRESH_SKEW: ${TOKHUB_AI_OAUTH_REFRESH_SKEW:-5m}
      TOKHUB_GOOGLE_OAUTH_CLIENT_ID: ${TOKHUB_GOOGLE_OAUTH_CLIENT_ID:-}
      TOKHUB_GOOGLE_OAUTH_CLIENT_SECRET: ${TOKHUB_GOOGLE_OAUTH_CLIENT_SECRET:-}
      TOKHUB_GOOGLE_OAUTH_PROJECT_ID: ${TOKHUB_GOOGLE_OAUTH_PROJECT_ID:-}
      TOKHUB_AI_EXPERIMENTAL_BRIDGE_ACK: ${TOKHUB_AI_EXPERIMENTAL_BRIDGE_ACK:-}
    ports:
      - "${TOKHUB_GATEWAY_PORT:-8082}:8080"
    networks:
      - default
      - deepseek-bridge
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/tokhub", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20

  prober:
    build:
      context: .
    environment:
      TOKHUB_ROLE: prober
      TOKHUB_ENV: ${TOKHUB_ENV:-development}
      TOKHUB_PUBLIC_URL: ${TOKHUB_PUBLIC_URL:-http://localhost:8080}
      TOKHUB_ADMIN_EMAIL: ${TOKHUB_ADMIN_EMAIL:-admin@tokhub.local}
      TOKHUB_SECRET_KEY: ${TOKHUB_SECRET_KEY:-dev-only-change-this-secret-key-32b}
