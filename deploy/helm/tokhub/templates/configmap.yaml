{{- if and .Values.aiAuthorization.opencliBrowser.enabled (ne .Values.aiAuthorization.opencliBrowser.riskAcknowledgement "I_ACCEPT_OPENCLI_PERSONAL_BROWSER_EXPERIMENTAL_RISK") }}
{{- fail "aiAuthorization.opencliBrowser.riskAcknowledgement must contain the exact OpenCLI browser experimental acknowledgement" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tokhub.fullname" . }}-config
  labels:
    {{- include "tokhub.labels" . | nindent 4 }}
data:
  TOKHUB_PUBLIC_URL: {{ .Values.publicUrl | quote }}
  TOKHUB_ADMIN_EMAIL: {{ .Values.adminEmail | quote }}
  DATABASE_URL: {{ .Values.databaseUrl | quote }}
  REDIS_URL: {{ .Values.redisUrl | quote }}
  NATS_URL: {{ .Values.natsUrl | quote }}
  TOKHUB_AI_WEB_AUTH_ENABLED: {{ .Values.aiAuthorization.enabled | quote }}
  TOKHUB_AI_GEMINI_OAUTH_ENABLED: {{ .Values.aiAuthorization.geminiOAuthEnabled | quote }}
  TOKHUB_AI_DEEPSEEK_GUIDED_ENABLED: {{ .Values.aiAuthorization.deepseekGuidedEnabled | quote }}
  TOKHUB_AI_DEEPSEEK_WEB_EXPERIMENTAL: {{ .Values.aiAuthorization.deepseekWeb.enabled | quote }}
  TOKHUB_AI_DEEPSEEK_WEB_BRIDGE_URL: {{ default (printf "http://%s-deepseek-web-bridge:5001" (include "tokhub.fullname" .)) .Values.aiAuthorization.deepseekWeb.bridgeUrl | quote }}
  TOKHUB_AI_DEEPSEEK_WEB_ACK: {{ .Values.aiAuthorization.deepseekWeb.riskAcknowledgement | quote }}
  TOKHUB_AI_CHATGPT_CODEX_EXPERIMENTAL: {{ .Values.aiAuthorization.chatgptCodexExperimental | quote }}
  TOKHUB_AI_EXPERIMENTAL_BRIDGE_ACK: {{ .Values.aiAuthorization.chatgptRiskAcknowledgement | quote }}
  TOKHUB_AI_OPENCLI_BROWSER_EXPERIMENTAL: {{ .Values.aiAuthorization.opencliBrowser.enabled | quote }}
  TOKHUB_AI_OPENCLI_BROWSER_ACK: {{ .Values.aiAuthorization.opencliBrowser.riskAcknowledgement | quote }}
  TOKHUB_AI_OPENCLI_BROWSER_TASK_TIMEOUT: {{ .Values.aiAuthorization.opencliBrowser.taskTimeout | quote }}
  TOKHUB_AI_OPENCLI_CHATGPT_ENABLED: {{ .Values.aiAuthorization.opencliBrowser.chatgpt.enabled | quote }}
  TOKHUB_AI_OPENCLI_GEMINI_ENABLED: {{ .Values.aiAuthorization.opencliBrowser.gemini.enabled | quote }}
  TOKHUB_AI_OPENCLI_DEEPSEEK_ENABLED: {{ .Values.aiAuthorization.opencliBrowser.deepseek.enabled | quote }}
  TOKHUB_AI_OPENCLI_CHATGPT_MIN_INTERVAL: {{ .Values.aiAuthorization.opencliBrowser.chatgpt.minimumInterval | quote }}
  TOKHUB_AI_OPENCLI_GEMINI_MIN_INTERVAL: {{ .Values.aiAuthorization.opencliBrowser.gemini.minimumInterval | quote }}
  TOKHUB_AI_OPENCLI_DEEPSEEK_MIN_INTERVAL: {{ .Values.aiAuthorization.opencliBrowser.deepseek.minimumInterval | quote }}
  TOKHUB_AI_OPENCLI_CHATGPT_HOURLY_LIMIT: {{ .Values.aiAuthorization.opencliBrowser.chatgpt.hourlyLimit | quote }}
  TOKHUB_AI_OPENCLI_GEMINI_HOURLY_LIMIT: {{ .Values.aiAuthorization.opencliBrowser.gemini.hourlyLimit | quote }}
  TOKHUB_AI_OPENCLI_DEEPSEEK_HOURLY_LIMIT: {{ .Values.aiAuthorization.opencliBrowser.deepseek.hourlyLimit | quote }}
  TOKHUB_AI_OPENCLI_CHATGPT_DAILY_LIMIT: {{ .Values.aiAuthorization.opencliBrowser.chatgpt.dailyLimit | quote }}
  TOKHUB_AI_OPENCLI_GEMINI_DAILY_LIMIT: {{ .Values.aiAuthorization.opencliBrowser.gemini.dailyLimit | quote }}
  TOKHUB_AI_OPENCLI_DEEPSEEK_DAILY_LIMIT: {{ .Values.aiAuthorization.opencliBrowser.deepseek.dailyLimit | quote }}
  TOKHUB_AI_OAUTH_TTL: {{ .Values.aiAuthorization.oauthTtl | quote }}
  TOKHUB_AI_OAUTH_REFRESH_SKEW: {{ .Values.aiAuthorization.oauthRefreshSkew | quote }}
  TOKHUB_AI_OAUTH_REFRESH_WORKERS: {{ .Values.aiAuthorization.oauthRefreshWorkers | quote }}
  TOKHUB_AI_OAUTH_PROVIDER_CONCURRENCY: {{ .Values.aiAuthorization.oauthProviderConcurrency | quote }}
  TOKHUB_AI_OAUTH_PROVIDER_QPS: {{ .Values.aiAuthorization.oauthProviderQps | quote }}
  TOKHUB_AI_OAUTH_REFRESH_ATTEMPT_TIMEOUT: {{ .Values.aiAuthorization.oauthRefreshAttemptTimeout | quote }}
  TOKHUB_GOOGLE_OAUTH_CLIENT_ID: {{ .Values.aiAuthorization.google.clientId | quote }}
  TOKHUB_GOOGLE_OAUTH_PROJECT_ID: {{ .Values.aiAuthorization.google.projectId | quote }}
