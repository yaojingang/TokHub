apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tokhub.fullname" . }}-secret
  labels:
    {{- include "tokhub.labels" . | nindent 4 }}
type: Opaque
stringData:
  TOKHUB_SECRET_KEY: {{ .Values.secretKey | quote }}
  TOKHUB_CREDENTIAL_ACTIVE_KEY_ID: {{ .Values.credentialActiveKeyId | quote }}
  TOKHUB_CREDENTIAL_ENCRYPTION_KEYS: {{ .Values.credentialEncryptionKeys | quote }}
  TOKHUB_CREDENTIAL_ACTIVE_FINGERPRINT_KEY_ID: {{ .Values.credentialActiveFingerprintKeyId | quote }}
  TOKHUB_CREDENTIAL_FINGERPRINT_KEYS: {{ .Values.credentialFingerprintKeys | quote }}
  TOKHUB_GOOGLE_OAUTH_CLIENT_SECRET: {{ .Values.aiAuthorization.google.clientSecret | quote }}
