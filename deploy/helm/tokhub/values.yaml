image:
  repository: tokhub
  tag: latest
  pullPolicy: IfNotPresent

publicUrl: http://tokhub.local
adminEmail: admin@tokhub.local
secretKey: dev-only-change-this-secret-key-32b
credentialActiveKeyId: legacy-v1
credentialEncryptionKeys: ""
credentialActiveFingerprintKeyId: legacy-v1
credentialFingerprintKeys: ""
databaseUrl: postgres://tokhub:tokhub@postgres:5432/tokhub?sslmode=disable
redisUrl: redis://redis:6379/0
natsUrl: nats://nats:4222

aiAuthorization:
  enabled: false
  geminiOAuthEnabled: false
  deepseekGuidedEnabled: true
  chatgptCodexExperimental: false
  chatgptRiskAcknowledgement: ""
  opencliBrowser:
    enabled: false
    riskAcknowledgement: ""
    taskTimeout: 2m
    chatgpt:
      enabled: true
      minimumInterval: 10s
      hourlyLimit: 30
      dailyLimit: 120
    gemini:
      enabled: true
      minimumInterval: 10s
      hourlyLimit: 30
      dailyLimit: 120
    deepseek:
      enabled: true
      minimumInterval: 15s
      hourlyLimit: 20
      dailyLimit: 80
  oauthTtl: 10m
  oauthRefreshSkew: 5m
  oauthRefreshWorkers: 8
  oauthProviderConcurrency: 4
  oauthProviderQps: 2
  oauthRefreshAttemptTimeout: 20s
  google:
    clientId: ""
    clientSecret: ""
    projectId: ""
  deepseekWeb:
    enabled: false
    deployBridge: true
    bridgeUrl: ""
    riskAcknowledgement: ""
    adminKey: ""
    existingAdminSecret: ""
    existingAdminSecretKey: DS2API_ADMIN_KEY
    image: ghcr.io/cjackhwang/ds2api:v4.6.1@sha256:afa05fa8d4f7ee886d11798a8c573f9df0aff8b12f9ac2635f8efd2ce7b55232
    replicas: 1

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  host: tokhub.local
  tls: []

roles:
  api:
    enabled: true
    replicas: 2
    public: true
  gateway:
    enabled: true
    replicas: 2
    public: true
  prober:
    enabled: true
    replicas: 1
    public: false
  worker:
    enabled: true
    replicas: 1
    public: false

resources: {}
